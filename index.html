<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="container">
    <div class="logo">Duda</div>
    <h1>Olá Fulano, Bem-vindo de volta!</h1>
    <p class="subtitulo">Faça seu login</p>

    <form class="caixa">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Sua senha">

      <a href="#" class="esqueci">Esqueceu a senha?</a>

      <button type="submit">Entrar</button>
    </form>

    <p class="cadastro">Não tem conta? <a href="#">Criar conta</a></p>
  </div>

</body>

</html>
